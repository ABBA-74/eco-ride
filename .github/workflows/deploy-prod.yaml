name: Deploy Ecoride Production

on:
    workflow_dispatch:

env:
    APP_ENV: prod
    APP_DEBUG: 0

    # 🐳 Docker
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecoride
    CONTAINER_NAME: ${{ secrets.CONTAINER_NAME_PROD }}


    # 🔐 DB (prod)
    DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    POSTGRES_DB: ${{ secrets.POSTGRES_DB_PROD }}
    POSTGRES_USER: ${{ secrets.POSTGRES_USER_PROD }}
    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}

    # ⚙️ VPS
    VPS_HOST: ${{ secrets.VPS_HOST }}
    VPS_USER: ${{ secrets.VPS_USER }}
    VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
    VPS_PORT: ${{ secrets.VPS_PORT }}

    # 🔔 Slack
    SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

jobs:
    # ---------------------------------------------
    # 1️⃣ BUILD JOB (build assets, composer, docker)
    # ---------------------------------------------
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: 🐘 Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, intl, pdo_pgsql
                  coverage: none

            - name: 🧩 Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction

            - name: 🧹 Clear Symfony cache
              run: php bin/console cache:clear --env=prod --no-interaction

            - name: 📦 Compile Symfony asset mapper
              run: php bin/console asset-map:compile

            - name: 🔐 Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: 🐳 Build Docker image (prod)
              run: docker build --pull --target=prod -t $DOCKER_IMAGE:latest .

            - name: 📤 Push Docker image
              run: docker push $DOCKER_IMAGE:latest

    # ---------------------------------------------
    #  2️⃣ DEPLOY JOB (ssh on VPS + docker run)
    # ---------------------------------------------
    deploy:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Prepare deploy script
              run: |
                mv .github/scripts/deploy-prod.sh deploy-prod.sh

            - name: 🧱 Ensure scripts directory exists on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  mkdir -p /var/www/ecoride/scripts

            - name: 📂 Copy deploy script to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: "deploy-prod.sh"
                target: "/var/www/ecoride/scripts/"
                overwrite: true

            - name: 🚀 Run deploy script on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  cd /var/www/ecoride/scripts/
                  chmod +x deploy-prod.sh
                  DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}" \
                  CONTAINER_NAME="${{ env.CONTAINER_NAME }}" \
                  DATABASE_URL="${{ env.DATABASE_URL }}" \
                  ./deploy-prod.sh
