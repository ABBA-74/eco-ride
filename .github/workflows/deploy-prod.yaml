name: Deploy Ecoride Production

on:
    workflow_dispatch:

env:
    APP_ENV: prod
    APP_DEBUG: 0

    APP_SECRET: ${{ secrets.APP_SECRET }}
    MAILER_DSN: ${{ secrets.MAILER_DSN }}
    JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
    CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN }}
    MESSENGER_TRANSPORT_DSN: "sync://"
    DEFAULT_URI: ${{ secrets.DEFAULT_URI_PROD }}

    # 🐳 Docker
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecoride
    CONTAINER_NAME: ${{ secrets.CONTAINER_NAME_PROD }}


    # 🔐 DB (prod)
    DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    POSTGRES_DB: ${{ secrets.POSTGRES_DB_PROD }}
    POSTGRES_USER: ${{ secrets.POSTGRES_USER_PROD }}
    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}

    # ⚙️ VPS
    VPS_HOST: ${{ secrets.VPS_HOST }}
    VPS_USER: ${{ secrets.VPS_USER }}
    VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
    VPS_PORT: ${{ secrets.VPS_PORT }}

    # 🔔 Slack
    SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

jobs:
    # ---------------------------------------------
    # 1️⃣ BUILD JOB (build assets, composer, docker)
    # ---------------------------------------------
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: 🐘 Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, intl, pdo_pgsql
                  coverage: none

            - name: 🧩 Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction

            - name: 🧹 Clear Symfony cache
              run: php bin/console cache:clear --env=prod --no-interaction

            - name: 📦 Compile Symfony asset mapper
              run: php bin/console asset-map:compile

            - name: 🔐 Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: 🐳 Build Docker image (prod)
              run: docker build --pull --target=prod -t $DOCKER_IMAGE:prod .

            - name: 📤 Push Docker image
              run: docker push $DOCKER_IMAGE:prod

    # ---------------------------------------------
    #  2️⃣ DEPLOY JOB (ssh on VPS + docker run)
    # ---------------------------------------------
    deploy:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🔍 Validate production database configuration
              env:
                PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
                PROD_POSTGRES_DB: ${{ secrets.POSTGRES_DB_PROD }}
                PROD_POSTGRES_USER: ${{ secrets.POSTGRES_USER_PROD }}
                PROD_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
              run: |
                python3 - <<'PY'
                import os
                from urllib.parse import urlsplit, unquote

                url = urlsplit(os.environ["PROD_DATABASE_URL"])

                checks = {
                    "PostgreSQL scheme": url.scheme in ("postgresql", "postgres"),
                    "Docker hostname": url.hostname == "database_prod",
                    "PostgreSQL port": url.port in (None, 5432),
                    "Database name": unquote(url.path.lstrip("/")) == os.environ["PROD_POSTGRES_DB"],
                    "Database user": unquote(url.username or "") == os.environ["PROD_POSTGRES_USER"],
                    "Database password": unquote(url.password or "") == os.environ["PROD_POSTGRES_PASSWORD"],
                }

                for label, valid in checks.items():
                    print(f"{label}: {'OK' if valid else 'FAILED'}")

                if not all(checks.values()):
                    raise SystemExit("Production database configuration is inconsistent.")

                print("Production database configuration validated.")
                PY

            - name: 🔐 Generate production environment file
              env:
                PROD_APP_SECRET: ${{ secrets.APP_SECRET }}
                PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
                PROD_POSTGRES_DB: ${{ secrets.POSTGRES_DB_PROD }}
                PROD_POSTGRES_USER: ${{ secrets.POSTGRES_USER_PROD }}
                PROD_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
                PROD_MAILER_DSN: ${{ secrets.MAILER_DSN }}
                PROD_JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
                PROD_CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN }}
                PROD_DEFAULT_URI: ${{ secrets.DEFAULT_URI_PROD }}
                PROD_DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
              run: |
                python3 - <<'PY'
                import os
                from pathlib import Path

                variables = {
                    "DOCKER_IMAGE": "PROD_DOCKER_IMAGE",
                    "APP_SECRET": "PROD_APP_SECRET",
                    "DATABASE_URL": "PROD_DATABASE_URL",
                    "POSTGRES_DB_PROD": "PROD_POSTGRES_DB",
                    "POSTGRES_USER_PROD": "PROD_POSTGRES_USER",
                    "POSTGRES_PASSWORD_PROD": "PROD_POSTGRES_PASSWORD",
                    "MAILER_DSN": "PROD_MAILER_DSN",
                    "JWT_PASSPHRASE": "PROD_JWT_PASSPHRASE",
                    "CORS_ALLOW_ORIGIN": "PROD_CORS_ALLOW_ORIGIN",
                    "DEFAULT_URI": "PROD_DEFAULT_URI",
                }

                lines = []
                for key, source in variables.items():
                    value = os.environ.get(source, "")
                    if not value:
                        raise SystemExit(f"Missing required variable: {source}")
                    if "\n" in value or "\r" in value:
                        raise SystemExit(f"Multiline value unsupported: {source}")
                    escaped = value.replace("\\", "\\\\").replace("'", "\\'")
                    lines.append(f"{key}='{escaped}'")

                lines.append("MESSENGER_TRANSPORT_DSN='sync://'")

                path = Path(".env.prod")
                path.write_text("\n".join(lines) + "\n", encoding="utf-8")
                path.chmod(0o600)

                print("Production environment file generated.")
                PY


            - name: 📦 Prepare deploy script
              run: |
                mv .github/scripts/deploy-prod.sh deploy-prod.sh

            - name: 🧱 Ensure scripts directory exists on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  mkdir -p /var/www/ecoride/scripts
                  mkdir -p /var/www/ecoride/docker/nginx

            - name: 📂 Copy deploy script to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: "deploy-prod.sh"
                target: "/var/www/ecoride/scripts/"
                overwrite: true

            - name: 📂 Copy production Docker configuration to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: "compose.prod.yaml,docker/nginx/prod.conf"
                target: "/var/www/ecoride/"
                overwrite: true

            - name: 🔐 Copy production environment to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: ".env.prod"
                target: "/var/www/ecoride/"
                overwrite: true

            - name: 🚀 Run deploy script on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  set -e
                  cd /var/www/ecoride

                  chmod 600 .env.prod
                  chmod +x scripts/deploy-prod.sh

                  ./scripts/deploy-prod.sh
