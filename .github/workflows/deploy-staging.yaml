name: Deploy Ecoride Staging

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_ENV: staging
    APP_DEBUG: 0
    LOAD_FIXTURES: ${{ secrets.LOAD_FIXTURES }}

    # 🐳 Docker
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecoride
    CONTAINER_NAME: ${{ secrets.CONTAINER_NAME_STAGING }}

    # ⚙️ VPS
    VPS_HOST: ${{ secrets.VPS_HOST }}
    VPS_USER: ${{ secrets.VPS_USER }}
    VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
    VPS_PORT: ${{ secrets.VPS_PORT }}

    # 🔔 Slack
    SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

    # 🔐 App secrets
    MAILER_DSN: ${{ secrets.MAILER_DSN }}
    JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
    CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN }}

jobs:
    # ---------------------------------------------
    # 1️⃣ TEST JOB
    # ---------------------------------------------
    tests:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: testdb
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                ports:
                    - 5432:5432
                options: >-
                  --health-cmd="pg_isready -U test -d testdb"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: 🐘 Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, intl, pdo_pgsql
                  coverage: none

            - name: 🧩 Install Composer
              run: composer install --no-progress --prefer-dist --no-scripts

            - name: 📦 Install importmap vendor assets
              run: php bin/console importmap:install

            - name: Force APP_ENV=test
              run: |
                echo "APP_ENV=test" >> $GITHUB_ENV
                echo "DATABASE_URL=postgresql://test:test@127.0.0.1:5432/testdb?serverVersion=16&charset=utf8" >> $GITHUB_ENV

            - name: 📦 Compile asset mapper
              run: php bin/console asset-map:compile --env=test

            - name: 🗄️ Create database (test)
              run: php bin/console doctrine:database:create --if-not-exists --env=test

            - name: 🚧 Run migrations (test)
              run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

            - name: 📥 Load fixtures (test)
              if: env.LOAD_FIXTURES == 'true'
              run: php bin/console doctrine:fixtures:load --env=test --no-interaction
              env:
                LOAD_FIXTURES: ${{ env.LOAD_FIXTURES }}

            - name: ✅ Run PHPUnit tests (TestDox)
              run: php bin/phpunit --testdox

    # ---------------------------------------------
    # 2️⃣ BUILD JOB
    # ---------------------------------------------
    build:
        runs-on: ubuntu-latest
        needs: tests

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: 🔐 Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: 🐳 Build Docker image (staging)
              run: docker build --pull --no-cache --target=prod -t $DOCKER_IMAGE:latest .

            - name: 📤 Push Docker image
              run: docker push $DOCKER_IMAGE:latest

    # ---------------------------------------------
    # 3️⃣ DEPLOY JOB
    # ---------------------------------------------
    deploy:
        runs-on: ubuntu-latest
        needs: build

        env:
            POSTGRES_DB: ${{ secrets.POSTGRES_DB_STAGING }}
            POSTGRES_USER: ${{ secrets.POSTGRES_USER_STAGING }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
            DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Prepare deploy script and nginx config
              run: |
                # Move the script to the root temporarily to avoid recreating the .github/ folder on the VPS
                cp .github/scripts/deploy-staging.sh deploy-staging.sh
                cp docker/nginx/staging.conf docker_nginx_staging.conf

            - name: 🧱 Ensure scripts directory exists on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  mkdir -p /var/www/ecoride/scripts

            - name: 📂 Copy deploy script to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: "deploy-staging.sh"
                target: "/var/www/ecoride/scripts/"
                overwrite: true

            - name: 📂 Copy compose.staging.yaml to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: "compose.staging.yaml"
                target: "/var/www/ecoride/"
                overwrite: true

            - name: 🧱 Ensure nginx config directory on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  mkdir -p /var/www/ecoride/docker/nginx

            - name: 📂 Copy nginx staging.conf to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                source: "docker_nginx_staging.conf"
                target: "/var/www/ecoride/docker/nginx/"
                overwrite: true

            - name: 📦 Generate .env.staging on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  cat > /var/www/ecoride/.env.staging << 'EOF'
                  DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
                  CONTAINER_NAME_STAGING=${{ secrets.CONTAINER_NAME_STAGING }}
                  DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
                  POSTGRES_DB_STAGING=${{ secrets.POSTGRES_DB_STAGING }}
                  POSTGRES_USER_STAGING=${{ secrets.POSTGRES_USER_STAGING }}
                  POSTGRES_PASSWORD_STAGING=${{ secrets.POSTGRES_PASSWORD_STAGING }}
                  APP_ENV=staging
                  APP_DEBUG=0
                  APP_SECRET=${{ secrets.APP_SECRET }}
                  MAILER_DSN=${{ secrets.MAILER_DSN }}
                  JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
                  CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN }}
                  MESSENGER_TRANSPORT_DSN=sync://
                  DEFAULT_URI=${{ secrets.DEFAULT_URI_STAGING }}
                  EOF

            - name: 🚀 Run deploy script on VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ env.VPS_HOST }}
                username: ${{ env.VPS_USER }}
                key: ${{ env.VPS_PRIVATE_KEY }}
                port: ${{ env.VPS_PORT }}
                script: |
                  cd /var/www/ecoride/scripts/
                  chmod +x deploy-staging.sh

                  DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}" \
                  CONTAINER_NAME="${{ env.CONTAINER_NAME }}" \
                  LOAD_FIXTURES="${{ env.LOAD_FIXTURES }}" \
                  ./deploy-staging.sh
